# config/model_config.yaml
xgboost:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 8.0   # roughly 1 / 0.12 positive rate
  random_state: 42
  eval_metric: "aucpr"

lightgbm:
  n_estimators: 300
  max_depth: 4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 8.0
  random_state: 42
  verbose: -1

logistic_regression:
  C: 1.0
  class_weight: "balanced"
  max_iter: 1000
  random_state: 42